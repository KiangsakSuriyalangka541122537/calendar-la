      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Kanit', 'sans-serif'],

    <style>
      html {
        font-size: 17px; /* Increased base font size for better readability */
      }
      body {
        font-family: 'Kanit', sans-serif;
        background-color: #f1f5f9;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }

      /* CSS Hack for Date Picker Click Area 
         This expands the calendar indicator to cover the entire input
      */
      .date-picker-trigger {
        position: relative;
      }
      .date-picker-trigger::-webkit-calendar-picker-indicator {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        opacity: 0;
        cursor: pointer;
      }
    </style>
